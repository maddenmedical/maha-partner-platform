<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1f1c2e" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAHA" />
    <!-- Twin-manifest trick, phase 1: if the page was opened via a direct
         ?app=admin / ?app=partner link (e.g. an install link sent to a
         partner before they've ever logged in), swap the manifest/icon/title
         synchronously, before any JS bundle loads or the browser reads the
         manifest for an install prompt. This runs ahead of the React-side
         role-based swap in use-pwa-manifest.ts, which only has a signed-in
         user's role to go on and previously left a signed-out visitor's
         install icon determined by whichever manifest happened to load
         first — see use-pwa-manifest.ts for the full swap contract. -->
    <script>
      (function () {
        var appParam = new URLSearchParams(window.location.search).get("app");
        if (appParam !== "admin") return;
        var manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) manifestLink.setAttribute("href", "/manifest-admin.json");
        var touchIconLink = document.querySelector('link[rel="apple-touch-icon"]');
        if (touchIconLink) touchIconLink.setAttribute("href", "/icon-192-admin.png");
        var titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (titleMeta) titleMeta.setAttribute("content", "MAHA Admin");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>MAHA Partner Platform</title>
    <meta name="description" content="MAHA Partner Platform — referrals, B2B ordering, education, and practitioner training." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
